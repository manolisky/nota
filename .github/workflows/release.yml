name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check nota.sty matches tag
        run: ./tools/release.sh check-tag "${GITHUB_REF_NAME}"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: nota-render/go.mod
          cache-dependency-path: nota-render/go.sum

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
